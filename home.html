<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue Tracker | Home</title>
    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- tailwind  + daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- stylesheet -->
     <link rel="stylesheet" href="./style/style.css">
</head>
<body class="bg-[#f8fafc]">
    <!-- header section -->
    <header>
        <div class="navbar bg-base-100 shadow-sm flex-wrap gap-4">
  <div class="flex-1 items-center">
    
    <a class="btn btn-ghost text-xl"> <img class=" w-8 h-8" src="./assets/github-logo.png" alt="">GitHub Issues Tracker</a>
  </div>
  <div class="flex gap-2">
    <div class="input flex-1">
    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <g
      stroke-linejoin="round"
      stroke-linecap="round"
      stroke-width=""
      fill="none"
      stroke="currentColor"
    >
      <circle cx="11" cy="11" r="8"></circle>
      <path d="m21 21-4.3-4.3"></path>
    </g>
  </svg>
  <input id="searchInput" type="search" required placeholder="Search issues..." />
  </div>
        <div class="rounded-sm">
            <button class="btn btn-primary">Search</button>
        </div>
  </div>
</div>
    </header>

    <!-- tab button section -->
     <section id="btn-container" class="mt-16 p-6 border w-11/12 mx-auto border-[#ffffff] bg-[#ffffff] shadow-[0px_1px_6px_0px_#00000014]">
        <button id="tab-all" onclick="switchTab('all')" class="btn  mr-2">All</button>
        <button id="tab-open" onclick="switchTab('open')" class="btn  mr-2">Open</button>
        <button id="tab-closed" onclick="switchTab('closed')" class="btn mr-2">Closed</button>
     </section>

     <!-- issues section -->
     <section class="mt-4 w-11/12 mx-auto bg-[#fbfbfb]">
        <div class="bg-[#fbfbfb] border border-[#e4e4e7] rounded-lg p-6 md:flex space-y-3 justify-between">
            <div class="flex gap-2 items-center">
                <img class="h-full w-15" src="./assets/Aperture.png" alt="">
                <div>
                <p class="text-[#1f2937] font-semibold text-[20px]"><span id="count-issuse">50</span> Issues</p>
                <p class="text-[#64748b]">Track and manage your project issues</p>
                </div>
            </div> 
            <div class="flex gap-4 items-center justify-center">
                <div class="flex gap-2 items-center "><div class="h-3 w-3 bg-[#00a96e] rounded-full"></div> <p class="font-medium text-base texr-[#64748b]"> Open </p></div>
                <div class="flex gap-2 items-center"><div class="h-3 w-3 bg-[#a855f7] rounded-full"></div><p class="font-medium text-base texr-[#64748b]">Closed </p></div>
            </div>
        </div>

        <!-- issues cards -->
         <section id="issues-card-container" class="grid sm:grid-cols-2  md:grid-cols-3 lg:grid-cols-4 p-6 border-[#ffffff] shadow-[0px_1px_6px_0px_#00000014] rounded-sm gap-5">

         </section>
     </section>



<dialog id="card_modal" class="modal modal-bottom sm:modal-middle">
  <div class="modal-box">
    
        <div id="details-container" class="p-4 space-y-3">
            
        </div>
    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-primary">Close</button>
      </form>
    </div>
  </div>
</dialog>



    <script src="./script/home.js"></script>
</body>
</html>
