<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github Issue Tracker | Login</title>
    <!-- favicon -->
    <link rel="shortcut icon" href="./assets/github-logo.png" type="image/x-icon">
    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- tailwind  + daisyui -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- stylesheet -->
     <link rel="stylesheet" href="./style/style.css">
</head>
<body class=" min-h-screen  flex items-center justify-center bg-[#f8fafc] ">
    <!-- login section -->
    <section class="fieldset bg-base-200 border-[#ffffff] bg-[#ffffff] box- rounded-box w-xs border p-4 mx-auto  space-y-1 shadow-[0px_5px_10px_0px_#00000014]">
        <div class="mx-auto text-center justify-items-center space-y-1">
            <img src="./assets/github-logo.png" alt="">
            <h1 class="font-semibold text-base text-[#1f2937]">GitHub Issues Tracker</h1>
            <p class="text-[16px] text-[#64748b]">Sign in to manage your issues</p>
        </div>
        <div>
            <label class="label font-medium text-[#1f2937] text-[16px]">Username</label>
            <input id="input-name" minlength="5" type="text" class="input border-[#e4e4e7]" placeholder="Enter Username" value="admin"/>
            <p class=" text-primary">Default: admin</p>

            <label class="label font-medium text-[#1f2937] text-[16px]">Password</label>
            <input id="input-password" minlength="6" type="password" class="input border-[#e4e4e7]" placeholder="Enter Password" value="admin123"/>
            <p class=" text-primary">Default: admin123</p>
            <button id="login-btn" class="btn btn-primary w-[100%] mt-4">Sign In</button>

        </div>
        <div class="flex items-center gap-2">
            <hr class="flex-1  border-[#e4e4e7]">
            <span class="text-[#1f2937]">OR</span>
            <hr class="flex-1 border-[#e4e4e7]">
        </div>
        <p class="text-center text-[#64748b]">Demo Credentials:</p>
        <div class="mx-auto text-center bg-[#f8fafc] p-5 rounded-md w-full space-y-1">
            <p class="text-[#1f2937] text-[16px]"><span class="font-semibold">Username:</span> admin </p> 
            <p class="text-[#1f2937] text-[16px]"><span class="font-semibold">Password:</span> admin123</p>
        </div>

    </section>
    

    <script src="./script/login.js"></script>
</body>
</html>
